<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Learn Phil</title>
<meta name="description" content="Fifteen short lessons on the Phil language, each with code you run and fix in the page.">
__FONTS__
<style>
/*__CSS__*/
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; align-items: start; padding-top: 28px; }
.toc { position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow: auto; font-size: 14.5px; }
.toc summary { display: none; }
.toc h3 { font: 600 11.5px var(--font-mark); text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 18px 0 6px; } .toc h3:first-of-type { margin-top: 0; }
.toc a { display: flex; gap: 8px; padding: 5px 8px; margin: 0 -8px; text-decoration: none; border-radius: 3px; }
.toc a .tick { width: 14px; flex: none; color: var(--good); font-weight: 700; }
.toc a[aria-current="true"] { background: var(--ink); color: var(--paper); } .toc a[aria-current="true"] .tick { color: var(--paper); }
@media (hover: hover) { .toc a:not([aria-current="true"]):hover { background: var(--line-hi); } }
.progress { font: 12px var(--font-code); color: var(--muted); margin: 0 0 14px; }
.lesson .chap { font: 600 12px var(--font-mark); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.lesson h1 { font: 600 clamp(24px, 4vw, 32px)/1.15 var(--font-mark); letter-spacing: -.03em; margin: 6px 0 16px; text-wrap: balance; }
.lesson .text p { margin: 0 0 12px; max-width: 68ch; }
.task { border-left: 3px solid var(--accent); background: var(--sheet); padding: 12px 16px; margin: 18px 0; max-width: 72ch; }
.task b { font: 600 12px var(--font-mark); display: block; color: var(--accent); margin-bottom: 2px; }
.task.done { border-left-color: var(--good); } .task.done b { color: var(--good); }
.inputs { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 16px; border: 1px solid var(--ink); border-bottom: 0; background: var(--sheet); font: 13px var(--font-code); }
.inputs label { display: flex; align-items: baseline; gap: 6px; } .inputs input { width: 90px; border: 0; border-bottom: 1px solid var(--ink); background: none; padding: 1px 2px; font: inherit; }
.inputs:empty { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.actions .spacer { flex: 1; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.out { border: 1px solid var(--rule); background: var(--sheet); padding: 12px 16px; min-height: 52px; font-size: 14.5px; }
.out:empty::before { content: "Press Run to see what happens."; color: var(--muted); }
.out .v { font: 600 12px var(--font-mark); margin-bottom: 4px; } .out .v.good { color: var(--good); } .out .v.bad { color: var(--bad); }
.out .hint { color: var(--muted); margin-top: 4px; }
.out pre { margin: 8px 0 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.out .verdict { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); font-weight: 600; } .out .verdict.good { color: var(--good); }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--rule); }
.finish { border: 1px solid var(--ink); padding: 18px 20px; margin-top: 26px; background: var(--sheet); } .finish h2 { margin: 0 0 6px; font-size: 18px; } .finish p { margin: 0 0 12px; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-top: 14px; }
  .toc { position: static; max-height: none; border: 1px solid var(--ink); background: var(--sheet); padding: 0 14px; }
  .toc summary { display: flex; justify-content: space-between; padding: 11px 0; font-weight: 600; cursor: pointer; list-style: none; } .toc summary::-webkit-details-marker { display: none; }
  .toc[open] { padding-bottom: 12px; } .toc[open] summary { border-bottom: 1px solid var(--rule); margin-bottom: 12px; }
  .progress { display: none; }
  .ed pre, .ed textarea { font-size: 12.5px; padding: 12px; }
}
</style>
</head>
<body>
__HEADER__
<div class="wrap layout">
  <details class="toc" id="toc" open><summary><span id="toc-now"></span><span aria-hidden="true">▾</span></summary><p class="progress" id="progress"></p><nav id="toc-list" aria-label="Lessons"></nav></details>
  <main class="lesson">
    <p class="chap" id="chap"></p>
    <h1 id="title"></h1>
    <div class="text" id="text"></div>
    <div class="task" id="task" hidden><b id="task-h">Your turn</b><span id="task-text"></span></div>
    <div class="inputs" id="inputs"></div>
    <div id="editor"></div>
    <div class="actions">
      <button type="button" class="btn" id="run">Run</button>
      <button type="button" class="linkbtn" id="reset">Start over</button>
      <button type="button" class="linkbtn" id="solve" hidden>Show the answer</button>
      <span class="spacer"></span>
      <a class="linkbtn" id="open-pg" href="../playground/">Open in the playground</a>
    </div>
    <div class="out" id="out" aria-live="polite"></div>
    <div class="finish" id="finish" hidden><h2>That's the course.</h2><p>You have read and fixed every kind of mistake Phil is built to stop. The playground has more examples, puzzles and a protocol designer.</p><a class="btn" href="../playground/">Open the playground</a> <a class="btn ghost" href="../otc/">See the OTC desk</a></div>
    <div class="pager"><a class="btn ghost" id="prev" href="#">Back</a><a class="btn" id="next" href="#">Next lesson</a></div>
  </main>
</div>
__FOOTER__
<script>/*__BUNDLE__*/</script>
</body>
</html>
