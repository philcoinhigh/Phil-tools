name: Clip Bounties
# Builds Clip Bounties (Phil's emitted upload server + bounty/runtime.c), proves it on a local Solana
# validator, deploys it to devnet when it changed, and keeps one practice challenge open for the site.
#
# Like onchain.yml, this must run on the `onchain` branch to read the devnet wallet;
# the nightly chain starts it there. A run started that way builds from main and commits to main.
on:
  push:
    branches: [onchain]
    paths: ["bounty/**", ".github/workflows/bounty.yml", "giveaway/build.sh", "scripts/sbf-clang.sh", "site/src/bounty-tx.ts", "site/src/bounty.ts", "test/bounty.ts"]
  workflow_dispatch:
    inputs:
      nightly:
        description: "Part of the nightly chain (started by the previous workflow)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: phil-bounty
jobs:
  bounty:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install the Solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)" 2>&1 | tail -3
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Restore the devnet wallet
        uses: actions/cache/restore@v4
        with:
          path: ~/.phil-devnet
          key: phil-devnet-wallet-v1
      - name: Restore the program's key
        uses: actions/cache/restore@v4
        with:
          path: ~/.phil-bounty
          key: phil-bounty-program-v1
      - name: Find the keys
        run: |
          mkdir -p ~/.phil-bounty bounty/out && chmod 700 ~/.phil-bounty
          : > bounty/out/build.log
          known=$(jq -r '.programId // empty' bounty/program.json 2>/dev/null || true)
          if [ -s ~/.phil-devnet/payer.json ]; then
            echo "HAVE_KEY=1" >> "$GITHUB_ENV"
            echo "WALLET=$(solana-keygen pubkey ~/.phil-devnet/payer.json)" >> "$GITHUB_ENV"
            if [ ! -s ~/.phil-bounty/program.json ]; then
              if [ -n "$known" ]; then echo "The program's key is recorded but not readable here; not making a second one." | tee -a bounty/out/build.log; echo "HAVE_KEY=0" >> "$GITHUB_ENV"
              else solana-keygen new --no-bip39-passphrase --silent -o ~/.phil-bounty/program.json; echo "NEW_PROGRAM_KEY=1" >> "$GITHUB_ENV"; fi
            fi
          else
            echo "The devnet wallet is not readable from this run (ref $GITHUB_REF)." | tee -a bounty/out/build.log
            echo "HAVE_KEY=0" >> "$GITHUB_ENV"
          fi
          if [ -s ~/.phil-bounty/program.json ]; then echo "PROGRAM=$(solana-keygen pubkey ~/.phil-bounty/program.json)" >> "$GITHUB_ENV"; else echo "PROGRAM=$known" >> "$GITHUB_ENV"; fi
      - name: Keep the new program key
        if: env.NEW_PROGRAM_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.phil-bounty
          key: phil-bounty-program-v1
      - name: Build the program
        run: |
          set -o pipefail
          npx esbuild bounty/run.ts --bundle --platform=node --packages=external --outfile=out/bounty-run.js --log-level=error
          giveaway/build.sh bounty/out/phil_bounty.so bounty/runtime.c 2>&1 | tee -a bounty/out/build.log
      - name: Prove it on a local test validator
        run: |
          set -o pipefail
          solana-keygen new --no-bip39-passphrase --silent -o "$RUNNER_TEMP/payer.json"
          solana-keygen new --no-bip39-passphrase --silent -o "$RUNNER_TEMP/program.json"
          LOCAL_PROGRAM=$(solana-keygen pubkey "$RUNNER_TEMP/program.json")
          solana-test-validator --reset --quiet --ledger "$RUNNER_TEMP/ledger" --mint "$(solana-keygen pubkey "$RUNNER_TEMP/payer.json")" --bpf-program "$LOCAL_PROGRAM" bounty/out/phil_bounty.so > "$RUNNER_TEMP/validator.log" 2>&1 &
          for i in $(seq 1 90); do [ "$(solana slot --url http://127.0.0.1:8899 2>/dev/null || echo 0)" -ge 5 ] 2>/dev/null && break; sleep 2; done
          node out/bounty-run.js selftest http://127.0.0.1:8899 "$LOCAL_PROGRAM" "$RUNNER_TEMP/payer.json" 2> >(tee -a bounty/out/build.log >&2) > bounty/out/selftest.local.json || { echo "--- local self-test failed; validator log:" >> bounty/out/build.log; tail -30 "$RUNNER_TEMP/validator.log" >> bounty/out/build.log; pkill -f solana-test-validator || true; exit 1; }
          pkill -f solana-test-validator || true
          jq -c '{ok, postUnits, enterUnits, awardUnits, drawUnits}' bounty/out/selftest.local.json | tee -a bounty/out/build.log
      - name: Deploy to devnet if the program changed
        id: deploy
        if: env.HAVE_KEY == '1'
        run: |
          set -o pipefail
          URL=https://api.devnet.solana.com
          bal=$(solana balance "$WALLET" --url "$URL" 2>/dev/null | awk '{print $1}')
          echo "devnet wallet $WALLET holds ${bal:-0} SOL" | tee -a bounty/out/build.log
          built=$(sha256sum bounty/out/phil_bounty.so | cut -d' ' -f1)
          last=$(jq -r '.deployedSha256 // empty' bounty/program.json 2>/dev/null || true)
          why=""
          solana account "$PROGRAM" --url "$URL" --output json 2>/dev/null | jq -e '.account.executable == true' >/dev/null || why="the program is not on devnet"
          [ -n "$why" ] || [ "$built" = "$last" ] || why="the program changed"
          if [ -z "$why" ]; then echo "program $PROGRAM is deployed and unchanged" | tee -a bounty/out/build.log; else
            echo "deploying because $why" | tee -a bounty/out/build.log
            solana-keygen new --no-bip39-passphrase --silent --force -o "$RUNNER_TEMP/buffer.json"
            solana program deploy --url "$URL" --keypair ~/.phil-devnet/payer.json --program-id ~/.phil-bounty/program.json --buffer "$RUNNER_TEMP/buffer.json" bounty/out/phil_bounty.so 2>&1 | grep -v -i -E "seed phrase|^([a-z]+ ){11}[a-z]+$|keypair|BUFFER_SIGNER|^=+$|recover|solana program close" | tee -a bounty/out/build.log
            echo "REDEPLOYED=true" >> "$GITHUB_ENV"
            sleep 20
            node out/bounty-run.js selftest "$URL" "$PROGRAM" ~/.phil-devnet/payer.json 2> >(tee -a bounty/out/build.log >&2) > bounty/out/selftest.devnet.json
            jq -c '{ok, postUnits, enterUnits, awardUnits, drawUnits}' bounty/out/selftest.devnet.json | tee -a bounty/out/build.log
          fi
          echo "DEPLOYED_SHA=$built" >> "$GITHUB_ENV"
      - name: Keep a practice challenge open
        if: env.HAVE_KEY == '1' && steps.deploy.outcome == 'success'
        run: node out/bounty-run.js demo https://api.devnet.solana.com "$PROGRAM" ~/.phil-devnet/payer.json bounty/demo.json 2> >(tee -a bounty/out/build.log >&2) || echo "the practice challenge could not be kept" | tee -a bounty/out/build.log
      - name: Record
        if: always()
        run: |
          mkdir -p bounty/out
          grep -v -E "^([a-z]+ ){11}[a-z]+$" bounty/out/build.log 2>/dev/null | tail -c 60000 > bounty/build.tail.log || true
          if [ -n "${DEPLOYED_SHA:-}" ]; then
            was=$(cat bounty/program.json 2>/dev/null || echo '{}')
            echo "$was" | jq --arg id "$PROGRAM" --arg wallet "$WALLET" --arg sha "$DEPLOYED_SHA" --arg day "$(date -u +%F)" --arg phil "$(jq -r .commit giveaway/emitted.json)" \
              --argjson bytes "$(stat -c %s bounty/out/phil_bounty.so)" --arg redeployed "${REDEPLOYED:-false}" --slurpfile local bounty/out/selftest.local.json \
              '. + {programId: $id, wallet: $wallet, deployedSha256: $sha, programBytes: $bytes, philCommit: $phil, checkedOn: $day, selftest: ($local[0] | {ok, postUnits, enterUnits, awardUnits, drawUnits})} + (if $redeployed == "true" or (.deployedOn | not) then {deployedOn: $day} else {} end)' > bounty/program.json.new && mv bounty/program.json.new bounty/program.json
            cp bounty/out/phil_bounty.so bounty/phil_bounty.so
          fi
      - name: Rebuild the site
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in bounty/program.json bounty/phil_bounty.so bounty/build.tail.log bounty/demo.json docs; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "Clip Bounties: $(date -u +%F)"
          # Another run may have pushed first. Its generated pages are rebuilt by whoever lands last, so on a clash keep ours.
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin "$(git rev-parse --abbrev-ref HEAD)"
            git rebase -X theirs FETCH_HEAD || { git checkout --theirs -- docs 2>/dev/null; git add -A docs; GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 5; }; }
          done; exit 1
