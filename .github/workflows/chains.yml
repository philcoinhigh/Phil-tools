name: Same Phil, every chain
# Builds one Phil program (Phil's emitted upload server + chains/runtime.c) for two machines and
# proves they agree: natively for Solana, and as a RISC-V image run by an interpreter contract on
# EVM chains. Deploys the Solana program to devnet, and the contract to each EVM testnet in
# chains/networks.json whose test key has been given funds.
#
# Like onchain.yml, this must run on the `onchain` branch to read the keys;
# the nightly chain starts it there. A run started that way builds from main and commits to main.
on:
  push:
    branches: [onchain]
    paths: ["chains/**", ".github/workflows/chains.yml", "site/src/rv64.ts", "site/src/chains.ts", "test/chains.ts"]
  workflow_dispatch:
    inputs:
      nightly:
        description: "Part of the nightly chain (started by the previous workflow)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: phil-chains
jobs:
  chains:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install the compilers
        run: |
          command -v ld.lld-18 >/dev/null || command -v ld.lld >/dev/null || sudo apt-get install -y -qq lld-18 clang-18 llvm-18
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)" 2>&1 | tail -3
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Restore the devnet wallet
        uses: actions/cache/restore@v4
        with:
          path: ~/.phil-devnet
          key: phil-devnet-wallet-v1
      - name: Restore the Solana program's key
        uses: actions/cache/restore@v4
        with:
          path: ~/.phil-chains
          key: phil-chains-program-v1
      - name: Restore the EVM test key
        uses: actions/cache/restore@v4
        with:
          path: ~/.phil-evm
          key: phil-evm-test-key-v1
      - name: Find the keys
        run: |
          mkdir -p ~/.phil-chains ~/.phil-evm chains/out && chmod 700 ~/.phil-chains ~/.phil-evm
          : > chains/out/build.log
          known=$(jq -r '.programId // empty' chains/program.json 2>/dev/null || true)
          if [ -s ~/.phil-devnet/payer.json ]; then
            echo "HAVE_KEY=1" >> "$GITHUB_ENV"
            echo "WALLET=$(solana-keygen pubkey ~/.phil-devnet/payer.json)" >> "$GITHUB_ENV"
            if [ ! -s ~/.phil-chains/program.json ]; then
              if [ -n "$known" ]; then echo "The program's key is recorded but not readable here; not making a second one." | tee -a chains/out/build.log; echo "HAVE_KEY=0" >> "$GITHUB_ENV"
              else solana-keygen new --no-bip39-passphrase --silent -o ~/.phil-chains/program.json; echo "NEW_PROGRAM_KEY=1" >> "$GITHUB_ENV"; fi
            fi
            # A key for EVM test networks only. It is made here, never printed, and only ever holds test coins.
            evm_known=$(jq -r '[.[] | .deployer // empty][0] // empty' chains/deployments.json 2>/dev/null || true)
            if [ ! -s ~/.phil-evm/key ]; then
              if [ -n "$evm_known" ]; then echo "The EVM test key is recorded but not readable here; not making a second one." | tee -a chains/out/build.log
              else node -e "process.stdout.write(require('ethers').Wallet.createRandom().privateKey)" > ~/.phil-evm/key; chmod 600 ~/.phil-evm/key; echo "NEW_EVM_KEY=1" >> "$GITHUB_ENV"; fi
            fi
            [ -s ~/.phil-evm/key ] && echo "HAVE_EVM_KEY=1" >> "$GITHUB_ENV" || true
          else
            echo "The devnet wallet is not readable from this run (ref $GITHUB_REF)." | tee -a chains/out/build.log
            echo "HAVE_KEY=0" >> "$GITHUB_ENV"
          fi
          if [ -s ~/.phil-chains/program.json ]; then echo "PROGRAM=$(solana-keygen pubkey ~/.phil-chains/program.json)" >> "$GITHUB_ENV"; else echo "PROGRAM=$known" >> "$GITHUB_ENV"; fi
      - name: Keep the new program key
        if: env.NEW_PROGRAM_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.phil-chains
          key: phil-chains-program-v1
      - name: Keep the new EVM test key
        if: env.NEW_EVM_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.phil-evm
          key: phil-evm-test-key-v1
      - name: Build one Phil program for two machines
        run: |
          set -o pipefail
          npx esbuild chains/run.ts --bundle --platform=node --packages=external --outfile=out/chains-run.js --log-level=error
          giveaway/build.sh chains/out/phil_chains.so chains/runtime.c 2>&1 | tee -a chains/out/build.log
          chains/build-riscv.sh chains/out/phil_chains.bin 2>&1 | tee -a chains/out/build.log
      - name: Prove the three machines agree (native, RISC-V, and the contract on a local Ethereum VM)
        run: |
          set -o pipefail
          npm run -s test:chains 2>&1 | grep -v -E "^ +[0-9]+: |undefined symbols" | tee -a chains/out/build.log
      - name: Prove the Solana program on a local test validator
        run: |
          set -o pipefail
          solana-keygen new --no-bip39-passphrase --silent -o "$RUNNER_TEMP/payer.json"
          solana-keygen new --no-bip39-passphrase --silent -o "$RUNNER_TEMP/program.json"
          LOCAL_PROGRAM=$(solana-keygen pubkey "$RUNNER_TEMP/program.json")
          solana-test-validator --reset --quiet --ledger "$RUNNER_TEMP/ledger" --mint "$(solana-keygen pubkey "$RUNNER_TEMP/payer.json")" --bpf-program "$LOCAL_PROGRAM" chains/out/phil_chains.so > "$RUNNER_TEMP/validator.log" 2>&1 &
          for i in $(seq 1 90); do [ "$(solana slot --url http://127.0.0.1:8899 2>/dev/null || echo 0)" -ge 5 ] 2>/dev/null && break; sleep 2; done
          node out/chains-run.js solana http://127.0.0.1:8899 "$LOCAL_PROGRAM" "$RUNNER_TEMP/payer.json" chains/out/solana.local.json 2> >(tee -a chains/out/build.log >&2) || { tail -30 "$RUNNER_TEMP/validator.log" >> chains/out/build.log; pkill -f solana-test-validator || true; exit 1; }
          pkill -f solana-test-validator || true
      - name: Deploy to Solana devnet if the program changed
        id: deploy
        if: env.HAVE_KEY == '1'
        run: |
          set -o pipefail
          URL=https://api.devnet.solana.com
          built=$(sha256sum chains/out/phil_chains.so | cut -d' ' -f1)
          last=$(jq -r '.deployedSha256 // empty' chains/program.json 2>/dev/null || true)
          why=""
          solana account "$PROGRAM" --url "$URL" --output json 2>/dev/null | jq -e '.account.executable == true' >/dev/null || why="the program is not on devnet"
          [ -n "$why" ] || [ "$built" = "$last" ] || why="the program changed"
          if [ -z "$why" ]; then echo "program $PROGRAM is deployed and unchanged" | tee -a chains/out/build.log; else
            echo "deploying because $why" | tee -a chains/out/build.log
            solana-keygen new --no-bip39-passphrase --silent --force -o "$RUNNER_TEMP/buffer.json"
            solana program deploy --url "$URL" --keypair ~/.phil-devnet/payer.json --program-id ~/.phil-chains/program.json --buffer "$RUNNER_TEMP/buffer.json" chains/out/phil_chains.so 2>&1 | grep -v -i -E "seed phrase|^([a-z]+ ){11}[a-z]+$|keypair|BUFFER_SIGNER|^=+$|recover|solana program close" | tee -a chains/out/build.log
            echo "REDEPLOYED=true" >> "$GITHUB_ENV"
            sleep 20
          fi
          node out/chains-run.js solana "$URL" "$PROGRAM" ~/.phil-devnet/payer.json chains/solana.json 2> >(tee -a chains/out/build.log >&2)
          echo "DEPLOYED_SHA=$built" >> "$GITHUB_ENV"
      - name: The EVM chains
        if: env.HAVE_EVM_KEY == '1'
        continue-on-error: true
        run: node out/chains-run.js evm ~/.phil-evm/key chains/deployments.json 2> >(tee -a chains/out/build.log >&2)
      - name: Start the next nightly workflow
        if: always() && (inputs.nightly || contains(github.event.head_commit.message, '[nightly]'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bounty.yml --repo "$GITHUB_REPOSITORY" --ref onchain -f nightly=true 2>&1 | tee -a chains/out/build.log || echo "could not start bounty.yml" | tee -a chains/out/build.log
      - name: Record
        if: always()
        run: |
          mkdir -p chains/out
          grep -v -E "^([a-z]+ ){11}[a-z]+$|^0x[0-9a-f]{64}$" chains/out/build.log 2>/dev/null | tail -c 60000 > chains/build.tail.log || true
          [ -s chains/out/phil_chains.bin ] && cp chains/out/phil_chains.bin chains/phil_chains.bin || true
          [ -s chains/out/local.json ] && cp chains/out/local.json chains/local.json || true
          if [ -n "${DEPLOYED_SHA:-}" ]; then
            was=$(cat chains/program.json 2>/dev/null || echo '{}')
            echo "$was" | jq --arg id "$PROGRAM" --arg wallet "$WALLET" --arg sha "$DEPLOYED_SHA" --arg day "$(date -u +%F)" --arg phil "$(jq -r .commit giveaway/emitted.json)" \
              --arg module "$(sha256sum giveaway/phil-llvm/phil-llvm-phase0-control-codec.ll | cut -d' ' -f1)" --argjson bytes "$(stat -c %s chains/out/phil_chains.so)" --arg redeployed "${REDEPLOYED:-false}" \
              '. + {programId: $id, wallet: $wallet, deployedSha256: $sha, programBytes: $bytes, philCommit: $phil, philModuleSha256: $module, checkedOn: $day} + (if $redeployed == "true" or (.deployedOn | not) then {deployedOn: $day} else {} end)' > chains/program.json.new && mv chains/program.json.new chains/program.json
            cp chains/out/phil_chains.so chains/phil_chains.so
          fi
      - name: Rebuild the site
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in chains/program.json chains/solana.json chains/deployments.json chains/local.json chains/phil_chains.so chains/phil_chains.bin chains/build.tail.log docs; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "Same Phil, every chain: $(date -u +%F)"
          # Another run may have pushed first. Its generated pages are rebuilt by whoever lands last, so on a clash keep ours.
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin "$(git rev-parse --abbrev-ref HEAD)"
            git rebase -X theirs FETCH_HEAD || { git checkout --theirs -- docs 2>/dev/null; git add -A docs; GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 5; }; }
          done; exit 1
