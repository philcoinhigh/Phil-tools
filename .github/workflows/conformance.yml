name: Conformance report
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check out Phil
        run: git clone --depth 1 https://github.com/abiggerhammer/phil ../phil
      - name: Run every Phil test program through the tools
        run: npm run conformance -- ../phil
      - run: npm run build
      - name: Commit the report if it changed
        run: |
          if git diff --quiet -- conformance/data.json docs; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add conformance/data.json docs
            git commit -m "Conformance report: Phil $(git -C ../phil rev-parse --short=10 HEAD)"
            git push
          fi
